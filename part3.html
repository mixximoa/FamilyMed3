<script>
        /* ==========================================
           1. STATE, CONSTANTS & OFFLINE PDF WORKER
        ========================================== */
        function configurePdfWorker() {
            if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
            }
        }
        configurePdfWorker();
        window.addEventListener('load', configurePdfWorker);

        const EMOJI_AVATARS = ['👨', '👩', '👦', '👧', '👴', '👵', '👶', '🧔', '👱‍♀️', '🦸‍♂️'];
        const MONTHS_UK = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];
        const MONTHS_SEARCH_TOKENS = [
            'січень січня', 'лютий лютого', 'березень березня', 'квітень квітня',
            'травень травня', 'червень червня', 'липень липня', 'серпень серпня',
            'вересень вересня', 'жовтень жовтня', 'листопад листопада', 'грудень грудня'
        ];
        
        const DEFAULT_SERIOUS_TAGS = ['#аналізи', '#кров', '#рентген', '#УЗД', '#рецепт', '#педіатр', '#стоматолог', '#щеплення', '#профогляд', '#виписка', '#кардіолог', '#ЛОР'];
        const DEFAULT_FUNNY_TAGS = ['#самолікування', '#продуло', '#психосоматика', '#вікове', '#іпохондрія', '#золота_аптека', '#хруснуло_в_спині', '#дитячий_садок'];

        let dbData = { members: [], visits: [], medications: [], cabinet: [], doctors: [], reminders: [] };
        let appSettings = JSON.parse(localStorage.getItem('med_pro_settings') || JSON.stringify({
            theme: 'light',
            customTags: [],
            searchHistory: [],
            backupIntervalDays: 7,
            lastBackupTimestamp: null,
            pinCode: ''
        }));

        let currentActiveTab = 'members';
        let currentMedSubTab = 'tracker';
        let ignoreNextPopState = false;
        let currentImportMode = 'replace';

        let selectedMemberAvatar = '👨';
        let currentVisitMedia = [];
        let currentVisitAudio = [];
        let mediaRecorder = null;
        let audioChunks = [];
        let alarmAudioInterval = null;

        let pinEntered = '';
        let pinMode = 'unlock';

        let activeViewerMedia = null;
        let currentBlobUrl = null;
        let zoomScale = 1;
        let panX = 0;
        let panY = 0;
        let startTouchDist = 0;
        let startZoomScale = 1;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;
        let lastTapTime = 0;

        document.getElementById('medTrackerDate').value = new Date().toISOString().split('T')[0];

        function initDateDropdowns() {
            let daySel = document.getElementById('mBirthDay');
            let monthSel = document.getElementById('mBirthMonth');
            let yearSel = document.getElementById('mBirthYear');

            daySel.innerHTML = '<option value="">День</option>' + Array.from({length: 31}, (_, i) => {
                let d = String(i + 1).padStart(2, '0');
                return `<option value="${d}">${i + 1}</option>`;
            }).join('');

            monthSel.innerHTML = '<option value="">Місяць</option>' + MONTHS_UK.map((m, i) => {
                let mv = String(i + 1).padStart(2, '0');
                return `<option value="${mv}">${m}</option>`;
            }).join('');

            let curYear = new Date().getFullYear();
            let yearsHtml = '<option value="">Рік</option>';
            for (let y = curYear; y >= 1925; y--) {
                yearsHtml += `<option value="${y}">${y}</option>`;
            }
            yearSel.innerHTML = yearsHtml;

            let cabM = document.getElementById('cabExpMonth');
            let cabY = document.getElementById('cabExpYear');
            cabM.innerHTML = MONTHS_UK.map((m, i) => `<option value="${String(i+1).padStart(2,'0')}">${String(i+1).padStart(2,'0')} - ${m}</option>`).join('');
            let cabYHtml = '';
            for (let y = curYear - 2; y <= curYear + 10; y++) {
                cabYHtml += `<option value="${y}">${y}</option>`;
            }
            cabY.innerHTML = cabYHtml;
        }
        initDateDropdowns();

        function triggerDatePicker(inputId) {
            let el = document.getElementById(inputId);
            if (el && typeof el.showPicker === 'function') {
                try { el.showPicker(); } catch (e) {}
            }
        }

        function buildDateSearchTokens(isoDate) {
            if (!isoDate || !isoDate.includes('-')) return isoDate || '';
            let parts = isoDate.split('-');
            let y = parts[0] || '';
            let m = parts[1] || '';
            let d = parts[2] || '';
            let mIdx = parseInt(m, 10) - 1;
            let mName = (mIdx >= 0 && mIdx < 12) ? MONTHS_SEARCH_TOKENS[mIdx] : '';
            return `${isoDate} ${y} ${y}.${m} ${y}.${m}.${d} ${d}.${m}.${y} ${d}.${m} ${m}.${y} ${y}/${m}/${d} ${d}/${m}/${y} ${mName} ${mName} ${y}`;
        }

        /* ==========================================
           2. PIN LOCK SYSTEM
        ========================================== */
        function checkInitialPinLock() {
            if (appSettings.pinCode && appSettings.pinCode.length === 4) {
                pinMode = 'unlock';
                pinEntered = '';
                updatePinDots();
                document.getElementById('pinPromptText').innerText = 'Введіть 4-значний PIN-код для входу';
                document.getElementById('pinLockOverlay').style.display = 'flex';
            }
            updatePinSettingsUI();
        }

        function updatePinDots() {
            for (let i = 0; i < 4; i++) {
                let dot = document.getElementById('pdot' + i);
                if (dot) dot.classList.toggle('filled', i < pinEntered.length);
            }
        }

        function pressPinDigit(d) {
            if (pinEntered.length >= 4) return;
            pinEntered += d;
            updatePinDots();
            if (pinEntered.length === 4) {
                setTimeout(evaluatePinEntry, 120);
            }
        }

        function backspacePinDigit() {
            pinEntered = pinEntered.slice(0, -1);
            updatePinDots();
        }

        function clearPinDigits() {
            if (pinMode === 'setup') {
                document.getElementById('pinLockOverlay').style.display = 'none';
                pinEntered = '';
                showToast('Встановлення PIN-коду скасовано', 'warning');
                return;
            }
            pinEntered = '';
            updatePinDots();
        }

        function evaluatePinEntry() {
            if (pinMode === 'unlock') {
                if (pinEntered === appSettings.pinCode) {
                    document.getElementById('pinLockOverlay').style.display = 'none';
                    pinEntered = '';
                } else {
                    pinEntered = '';
                    updatePinDots();
                    document.getElementById('pinPromptText').innerText = '❌ Невірний PIN-код! Спробуйте ще раз';
                    if (navigator.vibrate) navigator.vibrate(300);
                }
            } else if (pinMode === 'setup') {
                appSettings.pinCode = pinEntered;
                saveSettings();
                document.getElementById('pinLockOverlay').style.display = 'none';
                pinEntered = '';
                updatePinSettingsUI();
                showToast('🔐 Новий PIN-код успішно встановлено!');
            }
        }

        function setupOrChangePin() {
            pinMode = 'setup';
            pinEntered = '';
            updatePinDots();
            document.getElementById('pinPromptText').innerText = 'Придумайте новий 4-значний PIN (або натисніть «Стерти» для відміни)';
            document.getElementById('pinLockOverlay').style.display = 'flex';
        }

        function disablePinLock() {
            appSettings.pinCode = '';
            saveSettings();
            updatePinSettingsUI();
            showToast('🔓 Захист PIN-кодом вимкнено', 'warning');
        }

        function updatePinSettingsUI() {
            let st = document.getElementById('pinStatusText');
            let btn = document.getElementById('disablePinBtn');
            if (!st || !btn) return;
            if (appSettings.pinCode && appSettings.pinCode.length === 4) {
                st.innerHTML = 'Статус: <b style="color:var(--success);">🟢 Увімкнено (додаток захищено 4-значним PIN)</b>';
                btn.style.display = 'inline-flex';
            } else {
                st.innerHTML = 'Статус: <b>Вимкнено</b> (вхід без пароля)';
                btn.style.display = 'none';
            }
        }

        /* ==========================================
           3. ANDROID BACK GESTURE & MODAL HISTORY
        ========================================== */
        function isAnyModalOpen() {
            if (document.getElementById('mediaViewerModal').style.display === 'flex') return true;
            let modals = document.querySelectorAll('.modal');
            for (let m of modals) {
                if (m.style.display === 'flex' || m.style.display === 'block') return true;
            }
            return false;
        }

        function pushModalState() {
            if (window.history && window.history.pushState) {
                window.history.pushState({ modalOpen: true, tab: currentActiveTab }, '');
            }
        }

        window.addEventListener('popstate', function(e) {
            if (ignoreNextPopState) {
                ignoreNextPopState = false;
                return;
            }
            if (isAnyModalOpen()) {
                closeModals(true);
                return;
            }
            if (currentActiveTab !== 'members') {
                switchTab('members', true);
                window.history.pushState({ tab: 'members' }, '');
            }
        });

        document.addEventListener('backbutton', function(e) {
            if (isAnyModalOpen()) {
                e.preventDefault();
                closeModals(true);
            } else if (currentActiveTab !== 'members') {
                e.preventDefault();
                switchTab('members', true);
            } else {
                if (navigator.app && navigator.app.exitApp) {
                    navigator.app.exitApp();
                }
            }
        }, false);

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === modal && modal.id !== 'confirmModal' && modal.id !== 'alarmPopupModal') {
                    closeModals();
                }
            });
        });

        /* ==========================================
           4. HYBRID STORAGE ENGINE (NATIVE + IDB + LOCALSTORAGE)
        ========================================== */
        const DB_NAME = 'FamilyMedProDB';
        const DB_VERSION = 1;
        let idb = null;

        function ensureArraysExist() {
            if (!dbData || typeof dbData !== 'object') dbData = {};
            if (!Array.isArray(dbData.members)) dbData.members = [];
            if (!Array.isArray(dbData.visits)) dbData.visits = [];
            if (!Array.isArray(dbData.medications)) dbData.medications = [];
            if (!Array.isArray(dbData.cabinet)) dbData.cabinet = [];
            if (!Array.isArray(dbData.doctors)) dbData.doctors = [];
            if (!Array.isArray(dbData.reminders)) dbData.reminders = [];
        }

        function loadFromLocalStorageFallback() {
            try {
                let fullRaw = localStorage.getItem('family_med_db');
                if (fullRaw) {
                    let parsed = JSON.parse(fullRaw);
                    dbData = Object.assign(dbData, parsed);
                } else {
                    let m = localStorage.getItem('med_members'); if (m) dbData.members = JSON.parse(m);
                    let v = localStorage.getItem('med_visits'); if (v) dbData.visits = JSON.parse(v);
                    let meds = localStorage.getItem('med_medications'); if (meds) dbData.medications = JSON.parse(meds);
                    let cab = localStorage.getItem('med_cabinet'); if (cab) dbData.cabinet = JSON.parse(cab);
                    let docs = localStorage.getItem('med_doctors'); if (docs) dbData.doctors = JSON.parse(docs);
                    let rem = localStorage.getItem('med_reminders'); if (rem) dbData.reminders = JSON.parse(rem);
                }
            } catch (e) { console.error('Fallback error:', e); }
            ensureArraysExist();
        }

        function initDB() {
            return new Promise((resolve) => {
                ensureArraysExist();

                // 1. Спроба завантажити з нативної пам'яті Android (найбільш надійно на смартфонах)
                if (window.AndroidNative && typeof window.AndroidNative.loadAppData === 'function') {
                    try {
                        let nativeRaw = window.AndroidNative.loadAppData();
                        if (nativeRaw && nativeRaw.length > 2) {
                            let parsed = JSON.parse(nativeRaw);
                            dbData = Object.assign(dbData, parsed);
                            ensureArraysExist();
                            resolve();
                            return;
                        }
                    } catch (e) {
                        console.error('Native load error:', e);
                    }
                }

                // 2. Спроба завантажити з IndexedDB або LocalStorage
                try {
                    let request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = function(e) {
                        let db = e.target.result;
                        if (!db.objectStoreNames.contains('app_store')) {
                            db.createObjectStore('app_store');
                        }
                    };
                    request.onsuccess = function(e) {
                        idb = e.target.result;
                        try {
                            let tx = idb.transaction(['app_store'], 'readonly');
                            let store = tx.objectStore('app_store');
                            let req = store.get('main_data');
                            req.onsuccess = function() {
                                if (req.result && typeof req.result === 'object') {
                                    dbData = Object.assign(dbData, req.result);
                                } else {
                                    loadFromLocalStorageFallback();
                                }
                                ensureArraysExist();
                                resolve();
                            };
                            req.onerror = function() {
                                loadFromLocalStorageFallback();
                                resolve();
                            };
                        } catch (txErr) {
                            loadFromLocalStorageFallback();
                            resolve();
                        }
                    };
                    request.onerror = function() {
                        loadFromLocalStorageFallback();
                        resolve();
                    };
                } catch (err) {
                    loadFromLocalStorageFallback();
                    resolve();
                }
            });
        }

        function saveToIDB() {
            return new Promise((resolve) => {
                ensureArraysExist();

                // 1. МИТТЄВО оновлюємо весь інтерфейс на екрані
                try { renderAll(); } catch (e) { console.error('Render error:', e); }

                let jsonStr = '';
                try { jsonStr = JSON.stringify(dbData); } catch (e) {}

                // 2. Зберігаємо у нативну внутрішню пам'ять смартфона Android (чанками для великих баз)
                if (window.AndroidNative && jsonStr) {
                    try {
                        if (typeof window.AndroidNative.startAppDataSave === 'function') {
                            window.AndroidNative.startAppDataSave();
                            const CHUNK = 250000;
                            for (let i = 0; i < jsonStr.length; i += CHUNK) {
                                window.AndroidNative.appendAppDataChunk(jsonStr.substring(i, i + CHUNK));
                            }
                            window.AndroidNative.finishAppDataSave();
                        } else if (typeof window.AndroidNative.saveAppData === 'function') {
                            window.AndroidNative.saveAppData(jsonStr);
                        }
                    } catch (e) { console.error('Native save error:', e); }
                }

                // 3. Зберігаємо у LocalStorage
                try {
                    localStorage.setItem('med_members', JSON.stringify(dbData.members));
                    localStorage.setItem('med_cabinet', JSON.stringify(dbData.cabinet));
                    localStorage.setItem('med_doctors', JSON.stringify(dbData.doctors));
                    localStorage.setItem('med_medications', JSON.stringify(dbData.medications));
                    if (jsonStr.length < 4500000) {
                        localStorage.setItem('family_med_db', jsonStr);
                    }
                } catch (e) {}

                // 4. Зберігаємо в IndexedDB
                if (!idb) { resolve(); return; }
                try {
                    let tx = idb.transaction(['app_store'], 'readwrite');
                    let store = tx.objectStore('app_store');
                    store.put(dbData, 'main_data');
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (e) {
                    resolve();
                }
            });
        }

        function saveSettings() {
            localStorage.setItem('med_pro_settings', JSON.stringify(appSettings));
            checkBackupSchedule();
        }

        /* ==========================================
           5. UI HELPERS & HIGH-RES IMAGE COMPRESSION
        ========================================== */
        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) return;
            let toast = document.createElement('div');
            toast.className = `toast ${type === 'warning' ? 'toast-warning' : ''} ${type === 'danger' ? 'toast-danger' : ''}`;
            let icon = type === 'success' ? '✅' : (type === 'warning' ? '✏️' : '🗑️');
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        let confirmCallback = null;
        function askConfirm(title, message, onYes) {
            pushModalState();
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            confirmCallback = onYes;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        document.getElementById('confirmYesBtn').onclick = function() {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        };

        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
            confirmCallback = null;
        }

        function applyTheme() {
            if (appSettings.theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').innerText = '☀️';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeBtn').innerText = '🌙';
            }
        }

        function toggleTheme() {
            appSettings.theme = appSettings.theme === 'dark' ? 'light' : 'dark';
            saveSettings();
            applyTheme();
            showToast(appSettings.theme === 'dark' ? 'Увімкнено темну тему 🌙' : 'Увімкнено світлу тему ☀️');
        }

        function calculateAge(birthDateStr) {
            if (!birthDateStr) return '';
            let birth = new Date(birthDateStr);
            if (isNaN(birth.getTime())) return '';
            let now = new Date();
            let years = now.getFullYear() - birth.getFullYear();
            let months = now.getMonth() - birth.getMonth();
            if (months < 0 || (months === 0 && now.getDate() < birth.getDate())) {
                years--;
                months += 12;
            }
            if (years < 0) return '';
            if (years === 0) return `${months} міс.`;
            if (years < 7 && months > 0) return `${years} р. ${months} міс.`;
            return `${years} р.`;
        }

        function compressImage(file, maxWidth = 2200, quality = 0.88) {
            return new Promise((resolve) => {
                let reader = new FileReader();
                reader.onload = function(event) {
                    let img = new Image();
                    img.onload = function() {
                        let canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        let ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        /* ==========================================
           6. NAVIGATION & SEARCH
        ========================================== */
        function switchTab(tabName, fromBackGesture = false) {
            let previousTab = currentActiveTab;
            currentActiveTab = tabName;
            if (!fromBackGesture && window.history && window.history.pushState) {
                window.history.pushState({ tab: tabName }, '');
            }

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            
            const tabMap = { 'members': 0, 'visits': 1, 'meds': 2, 'doctors': 3, 'docs': 4, 'timeline': 5, 'analytics': 6, 'settings': 7 };
            if (tabMap[tabName] !== undefined) {
                document.querySelectorAll('.tab')[tabMap[tabName]].classList.add('active');
            }
            document.getElementById('tab-' + tabName).style.display = 'block';

            if (tabName === 'visits') {
                if (previousTab !== 'visits') {
                    document.getElementById('searchQuery').value = '';
                    document.getElementById('clearSearchBtn').style.display = 'none';
                    document.getElementById('filterMember').value = '';
                    document.getElementById('filterYear').value = '';
                    document.getElementById('filterType').value = '';
                }
                updateDropdowns();
                renderQuickFilterTags();
                renderVisits();
            }
            if (tabName === 'meds') { updateDropdowns(); renderMeds(); renderCabinet(); }
            if (tabName === 'doctors') { renderDoctorsDirectory(); }
            if (tabName === 'docs') {
                if (previousTab !== 'docs') {
                    document.getElementById('docSearchQuery').value = '';
                }
                updateDropdowns();
                renderDocQuickTags();
                renderDocumentsArchive();
            }
            if (tabName === 'timeline') { updateDropdowns(); renderTimeline(); }
            if (tabName === 'analytics') { updateDropdowns(); renderAnalytics(); }
            if (tabName === 'settings') { renderCustomTagsManage(); updateBackupSettingsUI(); updatePinSettingsUI(); }
        }

        function switchMedSubTab(sub) {
            currentMedSubTab = sub;
            document.getElementById('subTabBtnTracker').classList.toggle('active', sub === 'tracker');
            document.getElementById('subTabBtnCabinet').classList.toggle('active', sub === 'cabinet');
            document.getElementById('med-sub-tracker').style.display = sub === 'tracker' ? 'block' : 'none';
            document.getElementById('med-sub-cabinet').style.display = sub === 'cabinet' ? 'block' : 'none';
            if (sub === 'tracker') renderMeds();
            else renderCabinet();
        }

        function onSearchInput() {
            let val = document.getElementById('searchQuery').value;
            document.getElementById('clearSearchBtn').style.display = val.length > 0 ? 'flex' : 'none';
            renderVisits();
        }

        function clearSearchInput() {
            document.getElementById('searchQuery').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            renderVisits();
        }

        function setSearchQuery(q) {
            document.getElementById('searchQuery').value = q;
            document.getElementById('clearSearchBtn').style.display = q ? 'flex' : 'none';
            saveSearchQuery(q);
            renderVisits();
        }

        function getAllTags() {
            return {
                serious: [...DEFAULT_SERIOUS_TAGS, ...(appSettings.customTags || [])],
                funny: DEFAULT_FUNNY_TAGS
            };
        }

        function renderTagChipsForInput(containerId, inputId) {
            let tags = getAllTags();
            let container = document.getElementById(containerId);
            let html = tags.serious.map(t => `<span class="chip" onclick="appendTagToInput('${inputId}', '${t}')">${t}</span>`).join('');
            html += tags.funny.map(t => `<span class="chip chip-funny" onclick="appendTagToInput('${inputId}', '${t}')">😄 ${t}</span>`).join('');
            container.innerHTML = html;
        }

        function appendTagToInput(inputId, tag) {
            let inp = document.getElementById(inputId);
            let val = inp.value.trim();
            if (!val.includes(tag)) {
                inp.value = val ? (val + ' ' + tag) : tag;
            }
        }

        function renderQuickFilterTags() {
            let tags = getAllTags();
            let all = [...tags.serious.slice(0, 6), ...tags.funny.slice(0, 4)];
            document.getElementById('quickFilterTags').innerHTML = all.map(t => 
                `<span class="chip" onclick="setSearchQuery('${t}')">${t}</span>`
            ).join('');
        }

        function renderDocQuickTags() {
            let tags = ['#аналізи', '#кров', '#рентген', '#УЗД', '#рецепт', '#виписка', ...(appSettings.customTags || [])];
            document.getElementById('docQuickTags').innerHTML = tags.map(t => 
                `<span class="chip" onclick="document.getElementById('docSearchQuery').value='${t}'; renderDocumentsArchive();">${t}</span>`
            ).join('');
        }

        function saveSearchQuery(q) {
            q = q.trim();
            if (!q || q.length < 2) return;
            appSettings.searchHistory = [q, ...(appSettings.searchHistory || []).filter(x => x !== q)].slice(0, 8);
            saveSettings();
        }

        function showSearchHistory() {
            let box = document.getElementById('searchHistoryBox');
            let hist = appSettings.searchHistory || [];
            if (hist.length === 0) { box.style.display = 'none'; return; }
            box.innerHTML = `<div style="font-size:0.72rem; color:var(--text-light); margin-bottom:4px;">Останні пошукові запити:</div>` +
                hist.map(h => `<span class="history-tag" onclick="setSearchQuery('${h}'); document.getElementById('searchHistoryBox').style.display='none';">🕒 ${h}</span>`).join('');

        ========================================== */
        function playAlarmSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {}
        }

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function setMedReminderHours(medId, hours) {
            requestNotificationPermission();
            let med = (dbData.medications || []).find(x => x.id === medId);
            if (!med) return;
            let member = dbData.members.find(m => m.id === med.memberId);
            let memberName = member ? member.name : '';

            let targetTime = Date.now() + (hours * 3600 * 1000);
            let targetDate = new Date(targetTime);
            let timeStr = targetDate.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });

            ensureArraysExist();
            dbData.reminders = dbData.reminders.filter(r => r.medId !== medId);
            dbData.reminders.push({
                id: Date.now().toString(),
                medId: medId,
                medName: `${med.name} (${med.dose})`,
                memberName: memberName,
                targetTime: targetTime,
                timeStr: timeStr
            });
            saveToIDB();
            showToast(`⏰ Таймер встановлено на ${timeStr} (через ${hours} год)`);
        }

        function setMedReminderExactTime(medId, timeVal) {
            if (!timeVal) return;
            requestNotificationPermission();
            let med = (dbData.medications || []).find(x => x.id === medId);
            if (!med) return;
            let member = dbData.members.find(m => m.id === med.memberId);
            let memberName = member ? member.name : '';

            let [hh, mm] = timeVal.split(':').map(Number);
            let now = new Date();
            let target = new Date();
            target.setHours(hh, mm, 0, 0);
            if (target.getTime() <= now.getTime()) {
                target.setDate(target.getDate() + 1);
            }

            ensureArraysExist();
            dbData.reminders = dbData.reminders.filter(r => r.medId !== medId);
            dbData.reminders.push({
                id: Date.now().toString(),
                medId: medId,
                medName: `${med.name} (${med.dose})`,
                memberName: memberName,
                targetTime: target.getTime(),
                timeStr: timeVal
            });
            saveToIDB();
            showToast(`⏰ Таймер встановлено на ${timeVal}!`);
        }

        function setNativeAndroidAlarmForMed(medId) {
            let med = (dbData.medications || []).find(x => x.id === medId);
            if (!med) return;
            let member = dbData.members.find(m => m.id === med.memberId);
            let rem = (dbData.reminders || []).find(r => r.medId === medId);
            let target = rem ? new Date(rem.targetTime) : new Date(Date.now() + 4 * 3600 * 1000);
            let hh = target.getHours();
            let mm = target.getMinutes();
            let msg = `💊 ${med.name} (${med.dose}) - ${member ? member.name : ''}`;

            if (window.AndroidNative && typeof window.AndroidNative.setSystemAlarm === 'function') {
                let res = window.AndroidNative.setSystemAlarm(hh, mm, msg);
                if (res === 'OK') {
                    showToast(`⏰ Системний будильник Android відкрито на ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}!`);
                    return;
                }
            }
            openSystemReminder(medId);
        }

        function cancelMedReminder(medId) {
            dbData.reminders = (dbData.reminders || []).filter(r => r.medId !== medId);
            saveToIDB();
            showToast('Таймер скасовано', 'warning');
        }

        function openSystemReminder(medId) {
            let med = (dbData.medications || []).find(x => x.id === medId);
            if (!med) return;
            let member = dbData.members.find(m => m.id === med.memberId);
            let rem = (dbData.reminders || []).find(r => r.medId === medId);
            let startTime = rem ? new Date(rem.targetTime) : new Date(Date.now() + 4 * 3600 * 1000);
            let endTime = new Date(startTime.getTime() + 15 * 60 * 1000);

            let fmt = d => d.toISOString().replace(/-|:|\.\d+/g, '');
            let title = encodeURIComponent(`💊 Прийняти: ${med.name} (${med.dose}) - ${member ? member.name : ''}`);
            let details = encodeURIComponent(`Правило: ${med.rule}. ${med.notes || ''}`);
            let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${fmt(startTime)}/${fmt(endTime)}`;
            window.open(url, '_blank');
        }

        setInterval(() => {
            if (!dbData.reminders || dbData.reminders.length === 0) return;
            let now = Date.now();
            let triggered = false;
            dbData.reminders.forEach(r => {
                if (!r.fired && now >= r.targetTime) {
                    r.fired = true;
                    triggered = true;
                    triggerAlarmPopup(r);
                }
            });
            if (triggered) {
                dbData.reminders = dbData.reminders.filter(r => !r.fired);
                saveToIDB();
            }
        }, 5000);

        function triggerAlarmPopup(rem) {
            pushModalState();
            document.getElementById('alarmPopupText').innerText = `${rem.memberName ? rem.memberName + ': ' : ''}${rem.medName}`;
            document.getElementById('alarmPopupModal').style.display = 'flex';
            playAlarmSound();
            if (navigator.vibrate) navigator.vibrate([500, 300, 500, 300, 500]);
            if ('Notification' in window && Notification.permission === 'granted') {
                try {
                    new Notification('⏰ Час прийняти ліки!', {
                        body: `${rem.memberName}: ${rem.medName}`
                    });
                } catch (e) {}
            }
            if (alarmAudioInterval) clearInterval(alarmAudioInterval);
            alarmAudioInterval = setInterval(playAlarmSound, 2500);
        }

        function stopAlarmAndClose() {
            if (alarmAudioInterval) {
                clearInterval(alarmAudioInterval);
                alarmAudioInterval = null;
            }
            closeModals();
        }

        function saveMedCourse() {
            ensureArraysExist();
            let name = document.getElementById('medName').value.trim();
            if (!name) { showToast('Введіть назву препарату!', 'warning'); return; }

            let slots = Array.from(document.querySelectorAll('.med-slot-cb')).filter(cb => cb.checked).map(cb => cb.value);
            if (slots.length === 0) { showToast('Оберіть хоча б один час прийому!', 'warning'); return; }

            let editId = document.getElementById('medEditId').value;

            let existingLogs = {};
            let existingStatus = 'active';
            if (editId) {
                let old = dbData.medications.find(x => x.id === editId);
                if (old) { existingLogs = old.logs || {}; existingStatus = old.status || 'active'; }
            }

            let medObj = {
                id: editId || Date.now().toString(),
                memberId: document.getElementById('medMemberId').value,
                name: name,
                dose: document.getElementById('medDose').value.trim() || '1 доза',
                rule: document.getElementById('medRule').value,
                slots: slots,
                startDate: document.getElementById('medStartDate').value,
                days: parseInt(document.getElementById('medDays').value) || 7,
                notes: document.getElementById('medNotes').value.trim(),
                status: existingStatus,
                logs: existingLogs
            };

            if (editId) {
                let idx = dbData.medications.findIndex(x => x.id === editId);
                if (idx !== -1) dbData.medications[idx] = medObj;
                showToast(`Курс «${name}» оновлено! ✏️`, 'warning');
            } else {
                dbData.medications.push(medObj);
                showToast(`Курс «${name}» додано в трекер! 💊`);
            }
            closeModals();
            saveToIDB();
        }

        function toggleMedDose(medId, dateStr, slotName) {
            let med = (dbData.medications || []).find(x => x.id === medId);
            if (!med) return;
            if (!med.logs) med.logs = {};
            let key = `${dateStr}_${slotName}`;
            if (med.logs[key]) {
                delete med.logs[key];
                showToast(`Відмітку знято (${slotName})`, 'warning');
            } else {
                med.logs[key] = true;
                showToast(`Прийнято: ${med.name} (${slotName}) ✅`);
            }
            saveToIDB();
        }

        function toggleMedCourseStatus(medId) {
            let med = (dbData.medications || []).find(x => x.id === medId);
            if (!med) return;
            med.status = med.status === 'completed' ? 'active' : 'completed';
            saveToIDB();
            showToast(med.status === 'completed' ? 'Курс перенесено в архів завершених 🗄' : 'Курс знову активний 🟢');
        }

        function deleteMedCourse(medId) {
            askConfirm('Видалити курс ліків?', 'Ви впевнені, що хочете видалити цей препарат та історію його прийому?', () => {
                dbData.medications = (dbData.medications || []).filter(x => x.id !== medId);
                dbData.reminders = (dbData.reminders || []).filter(r => r.medId !== medId);
                saveToIDB();
                showToast('Курс ліків видалено', 'danger');
            });
        }

        function renderMeds() {
            ensureArraysExist();
            let selectedDate = document.getElementById('medTrackerDate').value || new Date().toISOString().split('T')[0];
            let memberFilter = document.getElementById('medFilterMember').value;
            let statusFilter = document.getElementById('medFilterStatus').value;

            let meds = (dbData.medications || []).filter(med => {
                let matchMember = !memberFilter || med.memberId === memberFilter;
                let st = med.status || 'active';
                return matchMember && st === statusFilter;
            });

            let container = document.getElementById('meds-list');
            if (meds.length === 0) {
                container.innerHTML = `<div class="empty-state">💊 ${statusFilter === 'active' ? 'Активних курсів прийому ліків немає. Натисніть кнопку зверху або перенесіть призначення з візиту!' : 'Завершених курсів поки немає.'}</div>`;
                return;
            }

            container.innerHTML = meds.map(med => {
                let member = dbData.members.find(m => m.id === med.memberId);
                let memberName = member ? member.name : 'Видалений';
                let start = new Date(med.startDate);
                let curDate = new Date(selectedDate);
                let diffDays = Math.floor((curDate - start) / (1000 * 60 * 60 * 24)) + 1;
                
                let dayBadge = '';
                if (diffDays < 1) dayBadge = `<span class="badge">Почнеться ${med.startDate}</span>`;
                else if (diffDays > med.days) dayBadge = `<span class="badge badge-danger">Курс закінчився (${med.days} дн.)</span>`;
                else dayBadge = `<span class="badge badge-success">День ${diffDays} з ${med.days}</span>`;

                let totalScheduledDoses = med.days * (med.slots ? med.slots.length : 1);
                let takenCount = Object.keys(med.logs || {}).length;
                let progressPct = Math.min(100, Math.round((takenCount / totalScheduledDoses) * 100));

                let activeRem = (dbData.reminders || []).find(r => r.medId === med.id);

                let dosesHtml = (med.slots || []).map(slot => {
                    let isTaken = med.logs && med.logs[`${selectedDate}_${slot}`];
                    return `
                        <button type="button" class="dose-btn ${isTaken ? 'taken' : ''}" onclick="toggleMedDose('${med.id}', '${selectedDate}', '${slot}')">
                            <span>${isTaken ? '✅' : '⭕'}</span>
                            <span>${slot}</span>
                        </button>
                    `;
                }).join('');

                return `
                    <div class="card" style="border-left: 5px solid var(--purple);">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; margin-bottom:6px;">
                            <div>
                                <span class="badge badge-purple">👤 ${memberName}</span>
                                ${dayBadge}
                            </div>
                            <span class="badge" style="background:var(--bg); color:var(--text);">🍽 ${med.rule}</span>
                        </div>

                        <h3>💊 ${med.name} <span style="font-weight:normal; font-size:0.9rem; color:var(--primary);">(${med.dose})</span></h3>
                        ${med.notes ? `<p><b>Примітка:</b> ${med.notes}</p>` : ''}

                        <div style="margin-top:8px;">
                            <div style="font-size:0.75rem; font-weight:700; color:var(--text-light);">1. ВІДМІТИТИ ПРИЙОМ НА ${selectedDate}:</div>
                            <div class="dose-grid">${dosesHtml}</div>
                        </div>

                        <div class="reminder-panel">
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                                <span style="font-size:0.78rem; font-weight:700; color:var(--purple);">🔔 2. НАГАДАТИ ПРО НАСТУПНИЙ ПРИЙОМ:</span>
                                ${activeRem ? `<span class="badge badge-success">⏰ Таймер на ${activeRem.timeStr} <b onclick="cancelMedReminder('${med.id}')" style="cursor:pointer; margin-left:4px;">✖</b></span>` : ''}
                            </div>
                            <div style="margin-top:6px; display:flex; align-items:center; flex-wrap:wrap; gap:4px;">
                                <span class="timer-chip" onclick="setMedReminderHours('${med.id}', 4)">+4 год</span>
                                <span class="timer-chip" onclick="setMedReminderHours('${med.id}', 6)">+6 год</span>
                                <span class="timer-chip" onclick="setMedReminderHours('${med.id}', 8)">+8 год</span>
                                <span class="timer-chip" onclick="setMedReminderHours('${med.id}', 12)">+12 год</span>
                                <input type="time" onchange="setMedReminderExactTime('${med.id}', this.value)" style="width:auto; padding:4px 8px; margin:0; font-size:0.8rem; height:30px;">
                                <span class="timer-chip" style="background:var(--purple); color:white;" onclick="setNativeAndroidAlarmForMed('${med.id}')">⏰ Будильник Android</span>
                                <span class="timer-chip" style="background:var(--purple-light);" onclick="openSystemReminder('${med.id}')">📅 Календар</span>
                            </div>
                        </div>

                        <div style="margin-top:12px;">
                            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-light);">
                                <span>Загальний прогрес курсу:</span>
                                <span><b>${takenCount} з ${totalScheduledDoses}</b> прийомів (${progressPct}%)</span>
                            </div>
                            <div class="bar-container"><div class="bar-fill" style="width:${progressPct}%; background:var(--success);"></div></div>
                        </div>

                        <div style="margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; display:flex; gap:6px; flex-wrap:wrap;">
                            <button class="btn btn-secondary btn-sm" onclick="toggleMedCourseStatus('${med.id}')">${med.status === 'completed' ? '🔄 Відновити курс' : '🏁 Завершити курс'}</button>
                            <button class="btn btn-warning btn-sm" onclick="openMedModal('${med.id}')">✏️ Редагувати</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteMedCourse('${med.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* --- HOME CABINET --- */
        function getCabinetItemExpiryStatus(expiryMonthStr) {
            if (!expiryMonthStr) return { status: 'ok', daysLeft: 999, label: 'Термін не вказано' };
            let parts = expiryMonthStr.split('-');
            let year = parseInt(parts[0]);
            let month = parseInt(parts[1]);
            let expDate = new Date(year, month, 0, 23, 59, 59);
            let now = new Date();
            let diffDays = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) {
                return { status: 'expired', daysLeft: diffDays, label: `🔴 ПРОСТРОЧЕНО (${expiryMonthStr})` };
            } else if (diffDays <= 60) {
                return { status: 'expiring', daysLeft: diffDays, label: `🟡 Скоро виходить: ${expiryMonthStr} (~${diffDays} дн.)` };
            } else {
                return { status: 'ok', daysLeft: diffDays, label: `🟢 Придатний до: ${expiryMonthStr}` };
            }
        }

        function renderCabinet() {
            ensureArraysExist();
            let items = dbData.cabinet || [];
            let total = items.length;
            let expiringCount = 0;
            let expiredCount = 0;

            items.forEach(it => {
                let st = getCabinetItemExpiryStatus(it.expiry).status;
                if (st === 'expiring') expiringCount++;
                if (st === 'expired') expiredCount++;
            });

            document.getElementById('cabStatTotal').innerText = total;
            document.getElementById('cabStatExpiring').innerText = expiringCount;
            document.getElementById('cabStatExpired').innerText = expiredCount;

            let query = (document.getElementById('cabSearchQuery').value || '').toLowerCase().trim();
            let catFilter = document.getElementById('cabFilterCat').value;
            let expFilter = document.getElementById('cabFilterExp').value;

            let filtered = items.filter(it => {
                let text = `${it.name} ${it.category} ${it.location} ${it.notes} ${it.expiry || ''}`.toLowerCase();
                let matchQuery = !query || text.includes(query);
                let matchCat = !catFilter || it.category === catFilter;
                let st = getCabinetItemExpiryStatus(it.expiry).status;
                let matchExp = expFilter === 'all' || st === expFilter;
                return matchQuery && matchCat && matchExp;
            });

            filtered.sort((a, b) => (a.expiry || '9999-99').localeCompare(b.expiry || '9999-99'));

            let container = document.getElementById('cabinet-list');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">🧰 У домашній аптечці за цим фільтром нічого не знайдено</div>';
                return;
            }

            container.innerHTML = filtered.map(it => {
                let expInfo = getCabinetItemExpiryStatus(it.expiry);
                let borderCol = expInfo.status === 'expired' ? 'var(--danger)' : (expInfo.status === 'expiring' ? 'var(--warning)' : 'var(--teal)');
                let badgeClass = expInfo.status === 'expired' ? 'badge-danger' : (expInfo.status === 'expiring' ? 'badge-money' : 'badge-success');

                return `
                    <div class="card" style="border-left: 5px solid ${borderCol};">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; margin-bottom:6px;">
                            <span class="badge">${it.category}</span>
                            <span class="badge ${badgeClass}">${expInfo.label}</span>
                        </div>
                        <h3>💊 ${it.name}</h3>
                        <p><b>📦 Залишок:</b> ${it.qty || 'не вказано'} | <b>📍 Де лежить:</b> ${it.location || 'Аптечка'}</p>
                        ${it.notes ? `<p><b>📝 Від чого / Дозування:</b> ${it.notes}</p>` : ''}
                        <div style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; display:flex; gap:6px; flex-wrap:wrap;">
                            <button class="btn btn-purple btn-sm" onclick="sendCabinetItemToTracker('${it.id}')">💊 Призначити курс</button>
                            <button class="btn btn-warning btn-sm" onclick="openCabinetModal('${it.id}')">✏️ Редагувати</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCabinetItem('${it.id}')">🗑️ Списати</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
